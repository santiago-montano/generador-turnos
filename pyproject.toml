[project]
name = "generador-turnos"
version = "0.1.0"
description = "Servicio web que genera horarios de turnos con un algoritmo genético."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generador_turnos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
