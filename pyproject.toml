[project]
name = "generador-turnos"
version = "0.1.0"
description = "Servicio web que genera horarios de turnos con un algoritmo genético."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generador_turnos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
# Los mensajes y comentarios están en español y usan a propósito los signos
# "×", "−" y "≥"; Ruff los marca como caracteres ambiguos (RUF001–RUF003).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
files = ["src"]
strict = true
