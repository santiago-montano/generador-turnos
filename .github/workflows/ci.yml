name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    name: Ruff, mypy y pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Reconstruir el entorno desde uv.lock
        run: uv sync --locked
      - name: Linting
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tipos
        run: uv run mypy
      - name: Pruebas
        run: uv run pytest -v

  contenedor:
    name: Imagen de Docker y /health
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t generador-turnos .
      - name: Iniciar el contenedor
        run: >
          docker run -d --name servicio -p 8000:8000
          -e TURNOS_CLAVE_ACCESO=clave-solo-para-ci
          generador-turnos
      - name: Verificar /health
        run: |
          for intento in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs servicio
          exit 1
